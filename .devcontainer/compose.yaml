services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    user: node
    working_dir: /workspaces/eve-trade-v2
    volumes:
      - ..:/workspaces/eve-trade-v2:cached
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eve_trade_v2
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_DB: eve_trade_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_trade_v2"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
