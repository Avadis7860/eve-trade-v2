<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVE Trade v2 — Opportunities</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #0f1115;
      color: #f4f5f7;
    }
    body { margin: 0; min-height: 100vh; background: #0f1115; }
    header { padding: 24px 28px 12px; border-bottom: 1px solid #292e39; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    select, button {
      border: 1px solid #3a4150; border-radius: 8px; background: #171b22; color: inherit;
      padding: 8px 10px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
    .card { border: 1px solid #2b313d; border-radius: 12px; padding: 16px; background: #151920; cursor: pointer; }
    .card:hover { border-color: #596274; }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .muted { color: #aeb5c2; }
    .score { font-size: 28px; font-weight: 700; }
    .badge { display: inline-block; border-radius: 999px; border: 1px solid #3a4150; padding: 4px 8px; font-size: 12px; }
    .warning { border: 1px solid #725d2f; background: #211c11; padding: 10px 12px; border-radius: 8px; margin-top: 12px; }
    .panel { margin-top: 24px; padding: 18px; border: 1px solid #2b313d; border-radius: 12px; background: #12161c; }
    pre { white-space: pre-wrap; word-break: break-word; overflow: auto; }
    .state { margin: 24px 0; padding: 14px; border-radius: 8px; border: 1px solid #333a47; }
  </style>
</head>
<body>
  <header>
    <div class="muted">EVE Trade v2</div>
    <h1>Opportunities</h1>
    <p class="muted">Observed and derived evidence exposed through the API. No order execution is available here.</p>
  </header>
  <main>
    <div class="toolbar">
      <label>
        Freshness
        <select id="freshness">
          <option value="">All</option>
          <option value="CURRENT">Current</option>
          <option value="STALE">Stale</option>
          <option value="UNKNOWN">Unknown</option>
        </select>
      </label>
      <button id="refresh">Refresh</button>
    </div>
    <div id="state" class="state" hidden></div>
    <section id="list" class="grid" aria-live="polite"></section>
    <section id="detail" class="panel" hidden></section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
